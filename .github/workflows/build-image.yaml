name: Build and push unifi-os-server image

on:
  release:
    types: [published]
  push:
    branches-ignore:
      - main
      - mod
    paths-ignore:
      - 'kubernetes/**'
      - '**.md'
      - 'docker-compose.yaml'
      - 'renovate.json'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      
      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=semver,pattern={{major}},prefix=v
            type=ref,event=branch
          flavor: |
            latest=auto
      
      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          file: ./Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false

      - name: Tag platform manifests
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          INDEX_DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          index=$(docker buildx imagetools inspect --raw "${IMAGE}@${INDEX_DIGEST}")

          for architecture in amd64 arm64; do
            digest=$(jq -er \
              --arg architecture "$architecture" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture) | .digest' \
              <<< "$index")

            docker buildx imagetools create \
              --prefer-index=false \
              --tag "${IMAGE}:${VERSION}-linux-${architecture}" \
              "${IMAGE}@${digest}"
          done
